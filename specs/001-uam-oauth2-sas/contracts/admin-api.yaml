openapi: 3.1.0
info:
  title: auth 管理 API
  version: 0.1.0
  description: |
    仅管理员可用（FR-019a）。认证：Bearer 访问令牌，需 scope `auth.admin`；
    服务端每次请求还会校验该用户仍是启用的管理员。其他调用一律 403，未带令牌 401。
    所有写操作写审计，含执行操作的管理员。
servers:
  - url: /admin/v1
security:
  - bearer: [auth.admin]
paths:
  /users:
    post:
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
      responses:
        '201': { description: 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { description: 用户名已存在（小写后比较）, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      summary: 用户列表
      parameters:
        - { name: username, in: query, schema: { type: string }, description: 前缀匹配 }
        - { name: status, in: query, schema: { type: string, enum: [ENABLED, DISABLED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    get:
      summary: 用户详情
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{id}/disable:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    post:
      summary: 禁用账号；同时删除该用户全部授权与 SSO 会话并通知各 client
      responses:
        '204': { description: 已禁用 }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{id}/enable:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    post:
      summary: 启用账号
      responses:
        '204': { description: 已启用 }
        '404': { $ref: '#/components/responses/Problem' }
  /users/{id}/unlock:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    post:
      summary: 解除锁定并清零失败计数
      responses:
        '204': { description: 已解锁 }
  /users/{id}/password-reset:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    post:
      summary: 重置密码；用户下次登录必须改密，同时使其现有会话与授权失效
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [temporaryPassword]
              properties:
                temporaryPassword: { type: string, writeOnly: true }
      responses:
        '204': { description: 已重置 }
        '400': { $ref: '#/components/responses/Problem' }
  /users/{id}/sessions:
    parameters: [ { $ref: '#/components/parameters/UserId' } ]
    delete:
      summary: 强制下线：结束该用户全部 SSO 会话、删除授权并通知各 client
      responses:
        '204': { description: 已结束 }
  /clients:
    post:
      summary: 登记 client
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClient' }
      responses:
        '201':
          description: 已登记；机密 client 的 `clientSecret` 只在此处返回一次
          content: { application/json: { schema: { $ref: '#/components/schemas/ClientCreated' } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { description: clientId 已存在, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    get:
      summary: client 列表
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Client' } } } } }
  /clients/{clientId}:
    parameters: [ { $ref: '#/components/parameters/ClientId' } ]
    get:
      summary: client 详情（不含 secret）
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: 更新回调地址、退出后地址、退出通知地址、scope、令牌有效期；即时生效，无需重启
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateClient' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Client' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /clients/{clientId}/disable:
    parameters: [ { $ref: '#/components/parameters/ClientId' } ]
    post:
      summary: 停用 client，并删除其全部授权（不影响其他 client）
      responses:
        '204': { description: 已停用 }
  /clients/{clientId}/enable:
    parameters: [ { $ref: '#/components/parameters/ClientId' } ]
    post:
      summary: 启用 client
      responses:
        '204': { description: 已启用 }
  /clients/{clientId}/secret-rotation:
    parameters: [ { $ref: '#/components/parameters/ClientId' } ]
    post:
      summary: 轮换机密 client 的凭据；旧凭据立即失效，新凭据只返回一次
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret: { type: string }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    ClientId: { name: clientId, in: path, required: true, schema: { type: string, maxLength: 100 } }
  responses:
    Problem:
      description: 错误（RFC 9457）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    CreateUser:
      type: object
      required: [username, initialPassword]
      properties:
        username: { type: string, minLength: 3, maxLength: 64, pattern: '^[A-Za-z0-9._-]+$', description: 服务端转小写存储 }
        initialPassword: { type: string, writeOnly: true, description: 须满足密码策略；用户首次登录必须改密 }
        admin: { type: boolean, default: false }
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        status: { type: string, enum: [ENABLED, DISABLED] }
        admin: { type: boolean }
        locked: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    UserPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    CreateClient:
      type: object
      required: [clientId, type, redirectUris, scopes]
      properties:
        clientId: { type: string, maxLength: 100 }
        type: { type: string, enum: [CONFIDENTIAL, PUBLIC] }
        redirectUris: { type: array, minItems: 1, items: { type: string, format: uri } }
        postLogoutRedirectUris: { type: array, items: { type: string, format: uri } }
        backchannelLogoutUri: { type: string, format: uri }
        scopes: { type: array, items: { type: string } }
        accessTokenTtlSeconds: { type: integer, minimum: 60, description: 必须短于刷新令牌的有效期（与另一项的实际生效值比较，未设置时取全局默认）；否则 400 }
        refreshTokenTtlSeconds: { type: integer, minimum: 60, description: 必须长于访问令牌的有效期；否则 400 }
    UpdateClient:
      type: object
      properties:
        redirectUris: { type: array, minItems: 1, items: { type: string, format: uri } }
        postLogoutRedirectUris: { type: array, items: { type: string, format: uri } }
        backchannelLogoutUri: { type: string, format: uri }
        scopes: { type: array, items: { type: string } }
        accessTokenTtlSeconds: { type: integer, minimum: 60, description: 必须短于刷新令牌的有效期（与另一项的实际生效值比较，未设置时取全局默认）；否则 400 }
        refreshTokenTtlSeconds: { type: integer, minimum: 60, description: 必须长于访问令牌的有效期；否则 400 }
    Client:
      allOf:
        - $ref: '#/components/schemas/CreateClient'
        - type: object
          properties:
            enabled: { type: boolean }
    ClientCreated:
      allOf:
        - $ref: '#/components/schemas/Client'
        - type: object
          properties:
            clientSecret: { type: string, description: 仅机密 client；只此一次返回 }
