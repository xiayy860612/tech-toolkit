# 本地开发依赖：PostgreSQL（业务数据）与 Redis（仅 BFF 限流）
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tenantcore
      POSTGRES_USER: tenantcore
      POSTGRES_PASSWORD: tenantcore-dev-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
