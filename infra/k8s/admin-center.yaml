apiVersion: v1
kind: Service
metadata:
  name: admin-center
  labels: {app.kubernetes.io/name: admin-center, app.kubernetes.io/part-of: tech-toolkit}
spec:
  selector: {app.kubernetes.io/name: admin-center}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-center
  labels: {app.kubernetes.io/name: admin-center, app.kubernetes.io/part-of: tech-toolkit}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: admin-center}
  template:
    metadata:
      labels: {app.kubernetes.io/name: admin-center, app.kubernetes.io/part-of: tech-toolkit}
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: admin-center}
      containers:
        - name: admin-center
          image: tech-toolkit/admin-center:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: UAM_BASE_URL, value: "http://uam:8080"}
            - name: UAM_SERVICE_KEY
              valueFrom: {secretKeyRef: {name: admin-center-service-key, key: UAM_SERVICE_KEY}}
            # 本地入口是 http，__Host- 前缀要求 HTTPS（见 apps/admin-center/AGENTS.md）
            - {name: SESSION_COOKIE_NAME, value: asid}
            # 前面恰好一层可信反向代理（edge）
            - {name: TRUSTED_PROXY_HOPS, value: "1"}
          startupProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            # /login 对匿名用户不调用 UAM，只反映本进程是否在服务
            httpGet: {path: /login, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
