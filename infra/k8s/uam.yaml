# UAM：只有 ClusterIP Service，且 NetworkPolicy 只放行 Admin Center（spec 假设：UAM 只在内网可达）。
apiVersion: v1
kind: Service
metadata:
  name: uam
  labels: {app.kubernetes.io/name: uam, app.kubernetes.io/part-of: tech-toolkit}
spec:
  selector: {app.kubernetes.io/name: uam}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uam
  labels: {app.kubernetes.io/name: uam, app.kubernetes.io/part-of: tech-toolkit}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: uam}
  template:
    metadata:
      labels: {app.kubernetes.io/name: uam, app.kubernetes.io/part-of: tech-toolkit}
    spec:
      # 大于 spring.lifecycle.timeout-per-shutdown-phase（30s），优雅停机能自己完成而不是被 SIGKILL
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: uam}
      containers:
        - name: uam
          image: tech-toolkit/uam:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/uam"}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_USER}}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}
            - {name: SPRING_DATA_REDIS_HOST, value: redis}
            - {name: SPRING_DATA_REDIS_PORT, value: "6379"}
            - name: UAM_CLIENTS
              valueFrom: {secretKeyRef: {name: uam-clients, key: UAM_CLIENTS}}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=60"}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            # 依赖 PostgreSQL 与 Redis；优雅停机时先变为未就绪
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # 等 Endpoints 摘除传播后再开始停机，避免滚动发布时最后几个请求落到正在关闭的实例
            preStop:
              exec: {command: ["sleep", "5"]}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
