# 本地 k8s 的入口：唯一向外暴露的组件（经 kubectl port-forward 访问），把请求转给 admin-center Service。
# 与 infra/local/nginx/nginx.conf 的区别：上游是 k8s Service（由 kube-proxy 分发到各 Pod），不再列实例；
# 代理参数与「可信代理一跳」的信任模型共用 infra/local/nginx/proxy-params.conf（对应 TRUSTED_PROXY_HOPS=1）。
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  access_log /dev/stdout;

  upstream admin_center {
    server admin-center:3000;
    keepalive 16;
    keepalive_timeout 4s;
    # 周期性回收长连接：停机中的 Pod 能在数秒内排空，且连接在 Pod 间重新分散（理由见 infra/local/nginx/nginx.conf）
    keepalive_time 5s;
  }

  server {
    listen 8080;
    location / {
      proxy_pass http://admin_center;
      include /etc/nginx/proxy-params.conf;
    }
  }
}
