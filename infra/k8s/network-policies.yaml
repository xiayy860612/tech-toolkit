# 入站默认拒绝，再逐条放行调用链：edge → admin-center → uam → postgres / redis（kind 集群用 Calico 做策略）。
# 只限制入站；出站不限制（Pod 需要 DNS 等）。edge 对集群内放行，外部流量走 kubectl port-forward。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: edge}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-to-admin-center
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: admin-center}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: edge}
      ports:
        - {port: 3000, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-center-to-uam
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: uam}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: admin-center}
      ports:
        - {port: 8080, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uam-to-data
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: uam}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
