apiVersion: v1
kind: Service
metadata:
  name: edge
  labels: {app.kubernetes.io/name: edge, app.kubernetes.io/part-of: tech-toolkit}
spec:
  selector: {app.kubernetes.io/name: edge}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels: {app.kubernetes.io/name: edge, app.kubernetes.io/part-of: tech-toolkit}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: edge}
  template:
    metadata:
      labels: {app.kubernetes.io/name: edge, app.kubernetes.io/part-of: tech-toolkit}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
            - {name: conf, mountPath: /etc/nginx/proxy-params.conf, subPath: proxy-params.conf, readOnly: true}
            - {name: cache, mountPath: /var/cache/nginx}
      volumes:
        - name: conf
          configMap: {name: edge-nginx}
        - name: cache
          emptyDir: {}
