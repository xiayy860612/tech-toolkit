# 本地 k8s（kind 集群 cka，见 scripts/deploy.sh）：PostgreSQL、Redis、UAM、Admin Center 与入口 nginx。
# 密钥类 Secret 不在这里：由 scripts/deploy.sh 在部署时生成并 apply，不入库。
# edge 的 proxy-params.conf 与多实例 compose 栈共用同一份文件（infra/local/nginx），
# 跨目录引用需要 --load-restrictor=LoadRestrictionsNone，所以请经 deploy.sh 应用，不要直接 kubectl apply -k。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tech-toolkit
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - uam.yaml
  - admin-center.yaml
  - edge.yaml
  - network-policies.yaml
configMapGenerator:
  - name: edge-nginx
    files:
      - nginx.conf
      - proxy-params.conf=../local/nginx/proxy-params.conf
