# UAM 前面的内部负载均衡（infra/local/docker-compose.scale.yml 的 uam-lb）：Admin Center 的 UAM_BASE_URL 指向它，
# 请求被轮询到 3 个 UAM 实例。只在 uam-net（内部网络）里监听，没有宿主机端口。
# 与入口一样：轮询、无粘滞（UAM 无状态，状态在 PostgreSQL / Redis）、到上游的长连接。
# 轮询状态保存在各 worker 内；多 worker 时，少量请求下分布会不均（每个 worker 各自从头轮询）。
# 本地编排的流量用 1 个 worker 足够，换来严格的逐个轮询，便于脚本断言「请求分到了全部实例」。
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  default_type application/octet-stream;
  server_tokens off;

  # 不记录 Authorization（服务密钥）与请求体；只记录落到哪个 UAM 实例
  log_format uamlb '$time_iso8601 "$request" status=$status upstream=$upstream_addr '
                   'upstream_status=$upstream_status rt=$request_time';
  access_log /dev/stdout uamlb;

  upstream uam {
    server uam-1:8080 max_fails=1 fail_timeout=3s;
    server uam-2:8080 max_fails=1 fail_timeout=3s;
    server uam-3:8080 max_fails=1 fail_timeout=3s;
    keepalive 64;
    # 同入口：周期性回收长连接，让停机中的实例能在宽限期内排空（Tomcat 的优雅停机同样要等连接上的请求结束）
    keepalive_timeout 15s;
    keepalive_time 5s;
  }

  server {
    listen 8080;

    # 仅供编排器的健康检查，不转发
    location = /lb-health {
      return 200 "ok\n";
    }

    # 会话校验是只读的 POST（只在超过 60s 才续期，重放无副作用），而且每个页面请求都要先调它。
    # UAM 停机时 Tomcat 会关闭空闲长连接；nginx 若刚好复用了这条连接，会报 "upstream prematurely closed connection"
    # 并返回 502，默认不会重放 POST，于是那个页面请求会显示「服务暂不可用」（实测重启期间偶发 1 次）。
    # 所以只对 verify 允许在这类错误后换下一个实例重试（non_idempotent）。
    # 其余 POST（登录、新建用户、改密、启停用）不重放：它们的重放是否安全取决于业务（改密重放会得到「当前密码不正确」）。
    location = /v1/auth/sessions/verify {
      proxy_pass http://uam;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 3s;
    }

    location / {
      proxy_pass http://uam;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 30s;
      # 重启一个 UAM 实例时：连接被拒 / 超时 / 上游刚好关闭连接（502）/ 实例已不接受流量（503）都换下一个实例重试。
      # 默认只在请求未发出（连接失败）或方法幂等时重试；UAM 的 POST（verify、login、创建用户）在请求已发出后不会被重放。
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
      proxy_next_upstream_timeout 3s;
    }
  }
}
