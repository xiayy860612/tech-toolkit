# 本地依赖：PostgreSQL 16 与 Redis 7。
# 只绑定回环地址，供本机运行的 UAM 连接；UAM 自己的端口不映射到宿主机（只允许 Admin Center 访问）。
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uam}
      POSTGRES_USER: ${POSTGRES_USER:-uam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 infra/local/.env 里设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - uam-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uam} -d ${POSTGRES_DB:-uam}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # AOF everysec：撤销类写入后 WAIT 1 配合使用（research R7）
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - uam-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  uam-pg:
  uam-redis:
