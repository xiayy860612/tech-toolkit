# 生产形态部署：nginx(TLS 终止) -> keycloak(start --optimized, 仅内网 HTTP) -> 已存在的外部 PostgreSQL
# 本地验证与生产使用同一份文件，差异只在 .env.prod 的取值（域名、端口、证书路径、密码）。
name: keycloak-prod

services:
  keycloak:
    build:
      context: .
      args:
        KEYCLOAK_VERSION: ${KEYCLOAK_VERSION:-26.4}
    image: keycloak-prod:${KEYCLOAK_VERSION:-26.4}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD in .env.prod}
      # 使用已存在的 PostgreSQL：库与账号需预先创建（见 AGENTS.md），本 compose 不管理数据库
      KC_DB_URL: jdbc:postgresql://${KC_DB_HOST:?set KC_DB_HOST in .env.prod}:${KC_DB_PORT:-5432}/${KC_DB_NAME:-keycloak}${KC_DB_URL_PARAMS:-}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?set KC_DB_PASSWORD in .env.prod}
      # 对外地址（含协议与端口），决定 issuer 与重定向 URL
      KC_HOSTNAME: ${KC_HOSTNAME:?set KC_HOSTNAME in .env.prod}
      # 对外 TLS 在 nginx 终止；容器间走 HTTP，且不对宿主机暴露端口
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # 健康/指标走独立管理端口 9000，不经 nginx 暴露
      KC_HTTP_MANAGEMENT_PORT: 9000
    expose:
      - "8080"
      - "9000"
    # 让容器内可用 host.docker.internal 访问宿主机上的数据库（Linux 需要此映射；本地验证用）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      KC_HOSTNAME: ${KC_HOSTNAME}
    ports:
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    networks: [backend]
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
