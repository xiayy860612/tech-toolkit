name: uam

on:
  push:
    paths:
      - "apps/uam/**"
      - "contracts/**"
      - ".github/workflows/uam.yml"
  pull_request:
    paths:
      - "apps/uam/**"
      - "contracts/**"
      - ".github/workflows/uam.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: lint（格式检查）
        run: mvn -B -f apps/uam/pom.xml spotless:check
      - name: typecheck（编译）
        run: mvn -B -f apps/uam/pom.xml -DskipTests compile
      - name: 测试 + 覆盖率门禁（行覆盖率 >= 90%，Testcontainers 需要 Docker）
        run: mvn -B -f apps/uam/pom.xml verify
