name: uam-ci

on:
  push:
    paths:
      - "apps/uam/**"
      - "contracts/**"
      - ".github/workflows/uam-ci.yml"
      - ".github/workflows/docker-publish.yml"
      - ".dockerignore"
  pull_request:
    paths:
      - "apps/uam/**"
      - "contracts/**"
      - ".github/workflows/uam-ci.yml"
      - ".github/workflows/docker-publish.yml"
      - ".dockerignore"

# 最小权限：只读仓库内容
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: lint（格式检查）
        run: mvn -B -f apps/uam/pom.xml spotless:check
      - name: typecheck（编译）
        run: mvn -B -f apps/uam/pom.xml -DskipTests compile
      - name: 测试 + 覆盖率门禁（行覆盖率 >= 90%，Testcontainers 需要 Docker）
        run: mvn -B -f apps/uam/pom.xml verify

  # 只有 main 的 push（且 verify 通过）才构建并推送镜像到阿里云 ACR；PR 与其他分支不触发（逻辑见 docker-publish.yml）
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/docker-publish.yml
    with:
      app: uam
    secrets: inherit
