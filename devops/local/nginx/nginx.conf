# 多实例栈的入口（devops/local/docker-compose.scale.yml）：把请求分发到 3 个 Admin Center 实例。
#
# 要点（FR-037）：
# - 轮询（nginx 默认的 round-robin），**没有会话粘滞**：不使用 ip_hash / hash / sticky / 按 cookie 的映射。
#   任一实例都能处理任一请求，因为 Admin Center 无状态，会话只在 UAM 的 Redis 里。
# - 到上游的长连接（upstream keepalive + HTTP/1.1，见 proxy-params.conf 的 Connection ""）。
# - 实例故障 / 重启时用 max_fails + proxy_next_upstream 摘掉并重试（FR-039）。
# 轮询状态保存在各 worker 内；多 worker 时，少量请求下分布会不均（每个 worker 各自从头轮询）。
# 本地编排的流量用 1 个 worker 足够，换来严格的逐个轮询，便于脚本断言「请求分到了全部实例」。
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  # $upstream_addr 记录每个请求实际落到哪个实例（含重试时的多个地址），验证脚本据此断言请求确实分散到了全部实例
  log_format scale '$time_iso8601 client=$remote_addr "$request" status=$status '
                   'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout scale;

  # ---- 轮询池（无粘滞）----
  # max_fails / fail_timeout：连接失败后在 fail_timeout 内不再往该实例发请求，期间的请求由其余实例承接
  upstream admin_center {
    server admin-center-1:3000 max_fails=1 fail_timeout=3s;
    server admin-center-2:3000 max_fails=1 fail_timeout=3s;
    server admin-center-3:3000 max_fails=1 fail_timeout=3s;
    keepalive 64;
    # 空闲长连接 4s 后由 nginx 先关（小于 Node 的 keepAliveTimeout 5s，避免上游刚好关闭而撞上 502）。
    keepalive_timeout 4s;
    # 单条长连接最多连续使用 5s 就由 nginx 主动关闭、下一个请求重新建连。
    # 原因：Next.js 收到 SIGTERM 后 server.close() 要等所有连接结束；入口的轮询流量会一直复用同一条「热」长连接，
    # 它永远等不到空闲，实例就要等到 stop_grace_period 被 SIGKILL（实测重启耗时 = 20s，在途请求被截断）。
    # 周期性回收长连接后，停机中的实例至多 5s 内就能排空；新连接被拒绝时 nginx 换下一个实例重试。
    keepalive_time 5s;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://admin_center;
      include /etc/nginx/proxy-params.conf;
    }
  }

  # ---- 仅供验证脚本：经同一个 nginx，把请求钉在指定实例上（宿主机 127.0.0.1:8091 ~ 8093）----
  upstream admin_center_1 { server admin-center-1:3000; keepalive 8; keepalive_timeout 4s; keepalive_time 5s; }
  upstream admin_center_2 { server admin-center-2:3000; keepalive 8; keepalive_timeout 4s; keepalive_time 5s; }
  upstream admin_center_3 { server admin-center-3:3000; keepalive 8; keepalive_timeout 4s; keepalive_time 5s; }

  server {
    listen 8091;
    location / {
      proxy_pass http://admin_center_1;
      include /etc/nginx/proxy-params.conf;
    }
  }
  server {
    listen 8092;
    location / {
      proxy_pass http://admin_center_2;
      include /etc/nginx/proxy-params.conf;
    }
  }
  server {
    listen 8093;
    location / {
      proxy_pass http://admin_center_3;
      include /etc/nginx/proxy-params.conf;
    }
  }
}
