# 入口 nginx 到 Admin Center 的公共代理参数（被 nginx.conf 的每个 location include）。

proxy_http_version 1.1;
# 与上游 keepalive 配合：清掉 Connection 头，否则 HTTP/1.1 的长连接会被 "close" 关掉
proxy_set_header Connection "";
# 保留浏览器看到的 Host（含端口）：Next.js 的 Server Action 会比较 Origin 与 Host / X-Forwarded-Host，
# 用 $host（会去掉端口）在非 80/443 端口上会被判为跨源而拒绝（"Invalid Server Actions request"）
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;

# 信任模型（对应 Admin Center 的 TRUSTED_PROXY_HOPS=1，见 apps/admin-center/src/lib/session/client-ip.ts）：
# Admin Center 取 X-Forwarded-For「右数第 1 项」作为终端地址。本 nginx 是唯一可信代理，
# $proxy_add_x_forwarded_for 把它看到的对端地址 $remote_addr 追加在末尾——这一项由 nginx 写入、客户端无法伪造；
# 客户端自带的 X-Forwarded-For 只会留在更左侧，Admin Center 不采信。
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# 不透传客户端自带的 X-Real-IP
proxy_set_header X-Real-IP $remote_addr;

proxy_connect_timeout 250ms;
proxy_read_timeout 30s;
proxy_send_timeout 30s;

# 重启一个实例时：连接被拒 / 超时 / 上游刚好关闭连接（502）/ 实例未就绪（503）都换下一个实例重试。
# 默认只对幂等方法（GET / HEAD ...）在「请求已发出」之后重试；POST（Server Action、退出）不会被重放，避免重复写入。
proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 5s;
