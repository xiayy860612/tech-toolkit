# 多实例栈（US10，FR-037 ~ FR-040）：3 个 Admin Center + 3 个 UAM + PostgreSQL + Redis + nginx 入口。
# 用法：devops/local/scripts/scale-checks.sh up|down（或直接 docker compose -f 本文件 --env-file devops/local/e2e.env ...）。
# 配置来自 devops/local/e2e.env（仅限本地的固定测试密钥）；项目名独立（uam-scale），可与 E2E 栈（uam-e2e，端口 3000）同时存在。
#
# 网络边界（与 docker-compose.stack.yml 同一原则：UAM 只对 Admin Center 实例可达）：
#   edge     nginx（入口）与 Admin Center 实例；唯一向宿主机发布端口的网络，且只绑定回环地址。
#   uam-net  Admin Center 实例 ↔ uam-lb（内部 nginx）↔ UAM 实例；内部网络，不发布端口。
#   data     UAM 实例 ↔ PostgreSQL / Redis；内部网络，不发布端口。
# Admin Center 通过 uam-lb 把请求轮询到 3 个 UAM 实例（UAM_BASE_URL=http://uam-lb:8080），UAM 没有任何宿主机端口。
name: uam-scale

x-uam: &uam
  image: uam-scale-uam:local
  # 镜像只在 uam-1 上构建一次；其余实例复用同一个镜像（同名镜像并行构建会冲突）
  pull_policy: never
  environment: &uam-env
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: "6379"
    UAM_CLIENTS: ${UAM_CLIENTS}
    # 三个 JVM 共用笔记本的内存：限制堆占比（容器内存 7.6 GiB 时约 0.9 GiB / 个）
    JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=12"
  networks: [data, uam-net]
  # 大于 spring.lifecycle.timeout-per-shutdown-phase（30s），让优雅停机能自己完成而不是被 SIGKILL
  stop_grace_period: 40s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    # 就绪探针（依赖 PostgreSQL 与 Redis）；优雅停机时它先于连接被拒变为未就绪
    test:
      - CMD-SHELL
      - >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /actuator/health/readiness HTTP/1.0\r\n\r\n" >&3 &&
        head -n1 <&3 | grep -q " 200 "'
    interval: 3s
    timeout: 3s
    retries: 40

x-admin-center: &admin-center
  image: uam-scale-admin-center:local
  pull_policy: never
  environment: &ac-env
    UAM_BASE_URL: http://uam-lb:8080
    UAM_SERVICE_KEY: ${UAM_SERVICE_KEY}
    SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
    # 前面恰好一层可信反向代理（edge 的 nginx）
    TRUSTED_PROXY_HOPS: "1"
  networks: [edge, uam-net]
  stop_grace_period: 20s
  depends_on:
    uam-lb:
      condition: service_healthy
  healthcheck:
    # /login 对匿名用户不调用 UAM，只反映本进程是否在服务
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login"]
    interval: 3s
    timeout: 3s
    retries: 40

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 压测数据量（10 万用户）需要比默认更多的共享缓冲；仅本地
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  uam-1:
    <<: *uam
    build:
      context: ../..
      dockerfile: apps/uam/Dockerfile
  uam-2:
    <<: *uam
  uam-3:
    <<: *uam

  # UAM 前面的内部负载均衡：Admin Center 只认识这一个地址，请求被轮询到 3 个 UAM 实例
  uam-lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/uam-lb.conf:/etc/nginx/nginx.conf:ro
    networks: [uam-net]
    depends_on:
      uam-1:
        condition: service_healthy
      uam-2:
        condition: service_healthy
      uam-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/lb-health"]
      interval: 3s
      timeout: 3s
      retries: 20

  admin-center-1:
    <<: *admin-center
    build:
      context: ../..
      dockerfile: apps/admin-center/Dockerfile
  admin-center-2:
    <<: *admin-center
  admin-center-3:
    <<: *admin-center

  # 入口：无会话粘滞的轮询（nginx/nginx.conf）。
  # 80 → 宿主机 127.0.0.1:8088（浏览器 / 压测入口）；8091 ~ 8093 → 宿主机 127.0.0.1:8091 ~ 8093，
  # 仍经同一个 nginx，只是把请求钉在第 1 ~ 3 个实例上，供验证脚本逐个实例断言（不是生产入口）。
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
    ports:
      - "127.0.0.1:8088:80"
      - "127.0.0.1:8091:8091"
      - "127.0.0.1:8092:8092"
      - "127.0.0.1:8093:8093"
    networks: [edge]
    depends_on:
      admin-center-1:
        condition: service_healthy
      admin-center-2:
        condition: service_healthy
      admin-center-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/login"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 压测（profile load，不随 up 启动）：与入口和 uam-lb 同网，用 grafana/k6 运行 devops/load/k6 下的脚本。
  #   docker compose -f 本文件 --env-file e2e.env --profile load run --rm k6 run /scripts/list-and-detail.js
  k6:
    # 固定版本：devops/load/RESULTS.md 的数字都是 k6 v2.3.0 测得（不用 latest，免得换版本后结果不可比）
    image: grafana/k6:2.3.0
    profiles: ["load"]
    volumes:
      - ../load/k6:/scripts:ro
    environment:
      BASE_URL: http://nginx:80
      UAM_URL: http://uam-lb:8080
      UAM_SERVICE_KEY: ${UAM_SERVICE_KEY}
    networks: [edge, uam-net]

networks:
  edge: {}
  uam-net:
    internal: true
  data:
    internal: true
