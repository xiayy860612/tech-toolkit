# 入站默认拒绝，再放行 Admin Center → UAM。UAM 不认证调用方，这条策略是它**唯一**的保护（服务身份后续另行实现），
# 所以必须有支持 NetworkPolicy 的 CNI；不支持时 UAM 对集群内所有 Pod 敞开。入口 → Admin Center 由 components/ingress 或 components/gateway 放行，
# UAM → 数据层由 components/in-cluster-data 放行（托管数据库在集群外，不受入站策略管）。
# 只限制入站；出站不限制（Pod 需要 DNS、访问托管数据库等）。NetworkPolicy 需要 CNI 支持（Calico、Cilium、云厂商的策略插件等），
# 不支持的集群里这些对象不生效，但也无害。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-center-to-uam
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: uam}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: admin-center}
      ports:
        - {port: 8080, protocol: TCP}
