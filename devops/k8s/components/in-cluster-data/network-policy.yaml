apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-uam-to-data
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [postgres, redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: uam}
      ports:
        - {port: 5432, protocol: TCP}
        - {port: 6379, protocol: TCP}
