# 本地经 kubectl port-forward 用 http://127.0.0.1:<端口> 访问：Host 是 IP，所以规则不写 host，也不启用 TLS。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-center
spec:
  ingressClassName: nginx
  tls: null
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-center
                port: {name: http}
