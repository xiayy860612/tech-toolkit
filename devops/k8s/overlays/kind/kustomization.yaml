# 本地 kind 集群（scripts/deploy.sh）：集群内数据层 + Gateway API 入口（Envoy Gateway，见 deploy.sh）+ 本地构建的镜像。
# Secret（postgres-credentials、uam-runtime、admin-center-runtime）由 deploy.sh 生成并 apply，不在这里。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tech-toolkit
resources:
  - ../../base
components:
  - ../../components/in-cluster-data
  - ../../components/gateway
images:
  - {name: uam, newName: tech-toolkit/uam, newTag: local}
  - {name: admin-center, newName: tech-toolkit/admin-center, newTag: local}
patches:
  - target: {kind: Deployment, name: admin-center}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: admin-center
      spec:
        template:
          spec:
            containers:
              - name: admin-center
                env:
                  # 本地入口是 http，__Host- 前缀要求 HTTPS（见 apps/admin-center/AGENTS.md）
                  - {name: SESSION_COOKIE_NAME, value: asid}
                  # 前面恰好一层可信代理（Envoy 数据面）
                  - {name: TRUSTED_PROXY_HOPS, value: "1"}
