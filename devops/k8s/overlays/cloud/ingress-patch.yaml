# CHANGE：域名、ingress 类、证书 Secret
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-center
spec:
  ingressClassName: nginx
  tls:
    - hosts: [admin.example.com]
      secretName: admin-center-tls
  rules:
    - host: admin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-center
                port: {name: http}
