<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f5f6f8; }
    main { background: #fff; padding: 2rem; border-radius: 8px; width: min(24rem, 90vw); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    label { display: block; margin: 1rem 0 .25rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem; font-size: 1rem; }
    button { margin-top: 1.25rem; width: 100%; padding: .6rem; font-size: 1rem; }
    .notice { background: #eef4ff; padding: .5rem .75rem; border-radius: 4px; }
    .errors { color: #b00020; padding-left: 1.25rem; }
    .hint { color: #555; font-size: .85rem; }
  </style>
</head>
<body>
<main>
  <h1>修改密码</h1>
  <p class="notice" th:if="${required}">你的密码由管理员设置，请先修改密码，之后才能继续。</p>
  <p class="notice" th:if="${param.changed}">密码已修改。</p>
  <ul class="errors" role="alert" th:if="${problems != null}">
    <li th:each="problem : ${problems}" th:text="${problem}"></li>
  </ul>
  <form th:action="@{/account/password}" method="post">
    <label for="currentPassword">当前密码</label>
    <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
    <label for="newPassword">新密码</label>
    <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required>
    <p class="hint">至少 12 位，不能是常见密码，也不能与用户名相同。</p>
    <button type="submit">修改密码</button>
  </form>
</main>
</body>
</html>
